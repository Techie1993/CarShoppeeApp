<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Insert title here</title>

<link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
                        url('/images/car1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, .18);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, .4);
        }

        .card-body {
            padding: 35px;
        }

        .title {
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .title i {
            font-size: 45px;
            color: #ffc107;
        }

        label {
            color: white;
            font-weight: 600;
        }

        .form-control {
            border-radius: 30px;
            height: 45px;
        }

        .input-group-text {
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            background: white;
        }

        .btn-register {
            width: 100%;
            border-radius: 30px;
            height: 45px;
            font-weight: bold;
            font-size: 17px;
        }

        .btn-login {
            width: 100%;
            border-radius: 30px;
            height: 45px;
            font-weight: bold;
        }

        .text-login {
            color: white;
            text-align: center;
            margin: 18px 0 10px;
        }

        .alert-msg {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .service-box{

    display:flex;
    flex-wrap:wrap;
    gap:10px;

}


.service-box label{

    background:#f5f8ff;

    border:1px solid #d6e4ff;

    padding:8px 15px;

    border-radius:20px;

    cursor:pointer;

    font-size:14px;

    color:#333;

    transition:.3s;

}


.service-box label:hover{

    background:#007bff;
    color:white;

}


.service-box input{

    margin-right:6px;

}
    </style>

</head>
<body>

<body>

<div class="main-container justify-content-end pr-5">
    <div class="card">
        <div class="card-body">

            <h2 class="title">
                <i class="bi bi-car-front-fill"></i><br>
                Service Booking Page
            </h2>
             <div th:if="${success}">
                    <h5 class="alert-msg text-success" th:text="${success}"></h5>
                </div>

                <div th:if="${error}">
                    <h5 class="alert-msg text-danger" th:text="${error}"></h5>
                </div>

            <form th:action="@{/bookingservice}"
      method="post">

                <!-- Company Name -->
                <div class="form-group">
                    <label>User Name</label>
                    <input type="text" name="username" class="form-control rounded-pill" placeholder="Enter User name">
                </div>

                
                <div class="form-group">
                    <label>User AadharCard Number</label>
                    <input type="text" name="aadharcard" class="form-control rounded-pill" placeholder="Enter Aadhar Card Number">
                </div>

               
                <div class="form-row">
                    <div class="form-group col-md-6 col-12">
                        <label>Vehicle Name</label>
                        <input type="text" name="vehname" class="form-control rounded-pill" placeholder="Vehicle Name">
                    </div>

                    <div class="form-group col-md-6 col-12">
                        <label>Vehicle Number</label>
                        <input type="text" name="veh_num" class="form-control rounded-pill" placeholder="Vehicle Number">
                    </div>
                </div>

                <div class="form-group">

					<label>Service Opted</label>
					
					<div class="service-box">
					
					    <label>
					        <input type="checkbox" name="service" value="General Service">
					        General Service
					    </label>
					
					    <label>
					        <input type="checkbox" name="service" value="Denting & Painting">
					        Denting & Painting
					    </label>
					
					    <label>
					        <input type="checkbox" name="service" value="Battery Service">
					        Battery Service
					    </label>
					
					    <label>
					        <input type="checkbox" name="service" value="Wheel Alignment">
					        Wheel Alignment
					    </label>
					
					    <label>
					        <input type="checkbox" name="service" value="Others">
					        Others
					    </label>

					</div>
			</div>
                
                <div class="form-group">
				    <label>Enlisted Garages</label>
				
				    <select name="garagelist" class="form-control rounded-pill">
				
				        <option value="">Select Garages</option>
				
				        <option th:each="garage : ${garages}"
				                th:value="${garage.garageName}"
				                th:text="${garage.garageName}">
				        </option>
				
				    </select>
			 </div>
            
                <div class="form-group">
                    <label>Booking Amount</label>
                    <input type="text" name="bookingamt" class="form-control rounded-pill" placeholder="Enter Booking Amount">
                </div>
                
                 <div class="form-group">
                    <label>Status</label>
                    <input type="text" name="activesw" class="form-control rounded-pill" placeholder="Enter Status">
                </div>
                
                <!-- Submit Button -->
                <button type="submit" name="submit" class="btn btn-warning btn-register mt-3">
                    Book Service
                </button>
            </form>
        </div>
    </div>
</div>

</body>

</html>
