<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    background:url('https://images.unsplash.com/photo-1486006920555-c77dcf18193c?auto=format&fit=crop&w=1600&q=80') center center/cover no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
}

.container{
    position:relative;
    width:100%;
    max-width:950px;
}

.form-box{
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:35px;
    color:#fff;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.form-box h2{
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
    letter-spacing:1px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

.input-box label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:500;
}

.input-box input,
.input-box select,
.input-box textarea{
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:15px;
}

.input-box textarea{
    resize:none;
    height:90px;
}

input::placeholder,
textarea::placeholder{
    color:#eee;
}

select option{
    color:#000;
}

.full{
    grid-column:1/3;
}

.radio-group{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.radio-group label{
    display:flex;
    align-items:center;
    gap:6px;
}

input[type=file]{
    background:rgba(255,255,255,.18);
    padding:10px;
}

.btn{
    margin-top:30px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:600;
    background:#ff9800;
    color:#fff;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#ff7700;
    transform:translateY(-2px);
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:1;
}

}
</style>

</head>
<body>

<div class="container">
<div class="form-box">

<h2>🚗 Garage Registration</h2>

<form action="/garage" method="post" enctype="multipart/form-data">

	<div class="grid">
		<div class="input-box">
			<label>Garage Name</label>
			<input type="text" name="garageName" placeholder="Enter Garage Name">
		</div>
		
		<div class="input-box">
			<label>Owner Name</label>
			<input type="text" name="owner" placeholder="Enter Owner Name">
		</div>
		
		<div class="input-box">
		<label>City</label>
		<input type="text" name="city" placeholder="Enter City">
		</div>
		
		<div class="input-box">
		<label>Experience (Years)</label>
		<input type="number" name="exp" placeholder="5">
		</div>
		
		<div class="input-box full">
		<label>Garage Address</label>
		<textarea  name="address" placeholder="Enter Full Address"></textarea>
		</div>
		
		<div class="input-box">
		<label>Services</label>
		<select name="services">
			<option>Select Service</option>
			<option>General Service</option>
			<option>Denting & Painting</option>
			<option>Engine Repair</option>
			<option>AC Repair</option>
			<option>Wheel Alignment</option>
			<option>Car Wash</option>
			<option>Battery Service</option>
		</select>
		</div>
		
		<div class="input-box">
			<label>Garage Type</label>
			
			<div class="radio-group">
				<label>
				<input type="radio" name="garageType" value="Car Garage">
				Car Garage
				</label>
				
				<label>
				<input type="radio" name="garageType" value="Bike Garage">
				Bike Garage
				</label>
				
				<label>
				<input type="radio" name="garageType" value="Both">
				Both
				</label>
			</div>	
		</div>
		<div class="input-box">
		<label>Working Hours</label>
		<input type="text" name="workingHrs" placeholder="9:00 AM - 8:00 PM">
		</div>
		
		<div class="input-box">
		<label>Registration No:</label>
		<input type="text" name="regnum" placeholder="Enter Registration Number">
		</div>
		
		<div class="input-box">
		<label>GST No:</label>
		<input type="text" name="gstNum" placeholder="Enter GST Number">
		</div>
		
		<div class="input-box">
		<label>Booking Amount (₹)</label>
		<input type="text" name="bookamt" placeholder="100">
		</div>
		
		<div class="input-box">
		<label>Address Proof</label>
		<input type="file" name="addressFile">
		</div>
		
		<div class="input-box">
		<label>Garage Description</label>
		<textarea 
			        name="description"
			        class="form-control"
			        placeholder="Enter Garage Description">
		</textarea>
		</div>
		
		<div class="input-box">
		<label>Garage Pictures</label>
		<input type="file" name="garageImages" multiple>
		</div>
		
		<div class="input-box">
		<label>Status</label>
		<input type="text" name="activesw" multiple>
		</div>
	</div>
	
	<button type="submit" class="btn">
	Register Garage
	</button>

</form>
</div>
</div>
</body>
</html>
