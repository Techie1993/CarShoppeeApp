<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Vehicle Registration</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
		url('/images/car1.jpg');
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
	background-attachment: fixed;
	font-family: 'Segoe UI', sans-serif;
}

.main-container {
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 30px;
}

.card {
	width: 100%;
	max-width: 520px;
	border: none;
	border-radius: 20px;
	background: rgba(255, 255, 255, .18);
	backdrop-filter: blur(15px);
	box-shadow: 0 15px 35px rgba(0, 0, 0, .4);
}

.card-body {
	padding: 35px;
}

.title {
	color: #fff;
	text-align: center;
	margin-bottom: 25px;
	font-weight: bold;
}

.title i {
	font-size: 45px;
	color: #ffc107;
}

label {
	color: white;
	font-weight: 600;
}

.form-control {
	border-radius: 30px;
	height: 45px;
}

.input-group-text {
	border-radius: 0 30px 30px 0;
	cursor: pointer;
	background: white;
}

.btn-register {
	width: 100%;
	border-radius: 30px;
	height: 45px;
	font-weight: bold;
	font-size: 17px;
}

.btn-login {
	width: 100%;
	border-radius: 30px;
	height: 45px;
	font-weight: bold;
}

.text-login {
	color: white;
	text-align: center;
	margin: 18px 0 10px;
}

.alert-msg {
	text-align: center;
	font-weight: bold;
	margin-bottom: 15px;
}
</style>
</head>

<body>

	<div class="main-container justify-content-end pr-5">

		<div class="card">

			<div class="card-body">

				<h2 class="title">
					<i class="bi bi-car-front-fill"></i><br> User Registration
				</h2>

				<div th:if="${success}">
					<h5 class="alert-msg text-success" th:text="${success}"></h5>
				</div>

				<div th:if="${error}">
					<h5 class="alert-msg text-danger" th:text="${error}"></h5>
				</div>

				<form th:action="@{/register}" th:object="${register}" method="post"
					enctype="multipart/form-data">

					<div class="form-group">
						<label>Full Name</label> <input type="text" class="form-control"
							placeholder="Enter Full Name" th:field="*{uname}" required>
					</div>

					<div class="form-group">
						<label>Email Address</label> <input type="email"
							class="form-control" placeholder="Enter Email"
							th:field="*{uemail}" required>
					</div>

					<div class="form-group">
						<label>Mobile Number</label> <input type="text"
							class="form-control" maxlength="10"
							placeholder="Enter Mobile Number" th:field="*{umob}" required>
					</div>

					<div class="mb-3">
						<label>Profile Image</label> <input type="file"
							name="profileImage" class="form-control">
					</div>


					<div class="form-group">
						<label>State</label> <input type="text" class="form-control"
							placeholder="Enter State" th:field="*{ustate}" required>
					</div>

					<div class="form-group">
						<label>City</label> <input type="text" class="form-control"
							placeholder="Enter City" th:field="*{ucity}" required>
					</div>

					<div class="form-group">
						<label>Password</label>

						<div class="input-group">
							<input type="password" class="form-control" id="password"
								placeholder="Enter Password" th:field="*{upass}" required>

							<div class="input-group-append">
								<span class="input-group-text" onclick="togglePassword()">
									<i class="bi bi-eye" id="eyeIcon"></i>
								</span>
							</div>
						</div>
					</div>

					<div class="form-group">
						<label>AadharNumber</label>

						<div class="input-group">
							<input type="password" class="form-control" id="uaadharcard"
								placeholder="Enter Aadhar Number" maxlength="12"
								th:field="*{uaadhar}" required>

							<div class="input-group-append">
								<span class="input-group-text" onclick="toggleAadhar()">
									<i class="bi bi-eye" id="eyeIconn"></i>
								</span>
							</div>
						</div>
					</div>

					<div class="form-group">
						<label>Status</label> <input type="text" class="form-control"
							placeholder="Status" th:field="*{activesw}">
					</div>

					<button class="btn btn-primary btn-register mt-3" type="submit">
						<i class="bi bi-person-plus-fill"></i> Register
					</button>

					<p class="text-login">Already have an account?</p>

					<a th:href="@{/login}" class="btn btn-success btn-login"> <i
						class="bi bi-box-arrow-in-right"></i> Login
					</a>

				</form>

			</div>
		</div>
	</div>

	<script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eye.classList.remove("bi-eye");
                eye.classList.add("bi-eye-slash");
            } else {
                password.type = "password";
                eye.classList.remove("bi-eye-slash");
                eye.classList.add("bi-eye");
            }
        }

        function toggleAadhar() {
            const aadhar = document.getElementById("uaadharcard");
            const eye = document.getElementById("eyeIconn");

            if (aadhar.type === "password") {
                aadhar.type = "text";
                eye.classList.remove("bi-eye");
                eye.classList.add("bi-eye-slash");
            } else {
                aadhar.type = "password";
                eye.classList.remove("bi-eye-slash");
                eye.classList.add("bi-eye");
            }
        }  
    </script>
</body>
</html>
