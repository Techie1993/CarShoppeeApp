
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Registration</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	min-height: 100vh;
	font-family: Arial, sans-serif;
	background:
		url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f")
		no-repeat center center/cover;
	position: relative;
}

/* Dark Overlay */
body::before {
	content: "";
	position: fixed;
	top: 0;
	left: 0;
	height: 100%;
	width: 100%;
	background: rgba(0, 0, 0, 0.50);
	z-index: 0;
}

/* Main Container */
.fullscreen {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 30px;
	position: relative;
	z-index: 1;
}

/* Main Card */
.card-box {
	width: 100%;
	max-width: 1100px;
	min-height: 650px;
	display: flex;
	border-radius: 22px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.12);
	backdrop-filter: blur(18px);
	box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
	border: 1px solid rgba(255, 255, 255, 0.20);
}

/* LEFT SIDE */
.left {
	flex: 1;
	padding: 35px;
	color: white;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

.left h2 {
	font-weight: bold;
}

.left p {
	font-size: 17px;
}

.carousel img {
	height: 250px;
	object-fit: cover;
	border-radius: 14px;
}

/* RIGHT SIDE */
.right {
	flex: 1.2;
	padding: 35px;
	color: white;
	overflow-y: auto;
	max-height: 650px;
}

.right h3 {
	font-weight: bold;
	margin-bottom: 25px;
}

label {
	font-weight: 600;
	margin-bottom: 6px;
}

.form-control {
	border-radius: 12px;
	padding: 10px;
	background: rgba(255, 255, 255, 0.95);
	border: none;
}

.form-control:focus {
	box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* Pagination / Steps */
.steps {
	display: flex;
	justify-content: space-between;
	margin-bottom: 30px;
	position: relative;
}

.steps::before {
	content: "";
	position: absolute;
	top: 17px;
	left: 10%;
	width: 80%;
	height: 3px;
	background: rgba(255, 255, 255, 0.30);
	z-index: 0;
}

.step {
	width: 36px;
	height: 36px;
	border-radius: 50%;
	background: rgba(255, 255, 255, 0.30);
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: bold;
	z-index: 1;
	transition: 0.3s;
}

.step.active {
	background: linear-gradient(45deg, #4f46e5, #06b6d4);
	box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
}

.step.completed {
	background: #198754;
}

/* Form Pages */
.form-page {
	display: none;
}

.form-page.active {
	display: block;
}

/* Buttons */
.btn-submit {
	background: linear-gradient(45deg, #4f46e5, #06b6d4);
	color: white;
	border: none;
	padding: 12px;
	border-radius: 12px;
	transition: 0.3s;
}

.btn-submit:hover {
	transform: scale(1.02);
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
	color: white;
}

.btn-back {
	background: rgba(255, 255, 255, 0.25);
	color: white;
	border: 1px solid rgba(255, 255, 255, 0.4);
	padding: 12px;
	border-radius: 12px;
}

.btn-back:hover {
	background: rgba(255, 255, 255, 0.35);
	color: white;
}

.button-group {
	display: flex;
	gap: 10px;
	margin-top: 25px;
}

.button-group button {
	flex: 1;
}

.page-title {
	margin-bottom: 20px;
	font-size: 20px;
	font-weight: bold;
}

/* Mobile */
@media ( max-width :768px) {
	.fullscreen {
		padding: 10px;
	}
	.card-box {
		flex-direction: column;
		min-height: auto;
	}
	.left {
		padding: 25px;
		min-height: 400px;
	}
	.right {
		padding: 25px;
		max-height: none;
	}
	.carousel img {
		height: 200px;
	}
}
</style>

</head>


<body>

	<div class="fullscreen">

		<div class="card-box">


			<!-- ================= LEFT SIDE ================= -->

			<div class="left">

				<div>

					<h2>🛍 Become a Seller</h2>

					<p>Start your online business journey with us.</p>

					<p>Register your seller account and start selling your products
						online.</p>

				</div>


				<!-- Carousel -->

				<div id="carouselExample" class="carousel slide"
					data-bs-ride="carousel">

					<div class="carousel-inner">

						<div class="carousel-item active">

							<img
								src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
								class="d-block w-100" alt="Product">

						</div>


						<div class="carousel-item">

							<img
								src="https://images.unsplash.com/photo-1556740749-887f6717d7e4"
								class="d-block w-100" alt="Shopping">

						</div>


						<div class="carousel-item">

							<img
								src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
								class="d-block w-100" alt="Business">

						</div>

					</div>


					<button class="carousel-control-prev" type="button"
						data-bs-target="#carouselExample" data-bs-slide="prev">

						<span class="carousel-control-prev-icon"></span>

					</button>


					<button class="carousel-control-next" type="button"
						data-bs-target="#carouselExample" data-bs-slide="next">

						<span class="carousel-control-next-icon"></span>

					</button>

				</div>

			</div>


			<!-- ================= RIGHT SIDE ================= -->

			<div class="right">


				<h3>Seller Registration</h3>


				<!-- STEP PAGINATION -->

				<div class="steps">

					<div class="step active" id="step1">1</div>

					<div class="step" id="step2">2</div>

					<div class="step" id="step3">3</div>

				</div>


				<!-- ================= FORM ================= -->

				<form th:action="@{/seller}" th:object="${seller}" method="post"
					enctype="multipart/form-data">


					<!-- ================================= -->
					<!-- PAGE 1 : PERSONAL DETAILS -->
					<!-- ================================= -->

					<div class="form-page active" id="page1">

						<div class="page-title">👤 Personal Details</div>


						<!-- Name -->

						<div class="mb-3">

							<label>Name</label> <input type="text" th:field="*{name}"
								class="form-control" maxlength="25" pattern="[A-Za-z ]{1,25}"
								oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
								required>

						</div>


						<!-- Email -->

						<div class="mb-3">

							<label>Email</label> <input type="email" th:field="*{email}"
								class="form-control" required>

						</div>


						<!-- Mobile -->

						<div class="mb-3">

							<label>Mobile</label> <input type="tel" th:field="*{mobile}"
								class="form-control" maxlength="10" pattern="[0-9]{10}"
								oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>

						</div>


						<!-- Description -->

						<div class="mb-3">

							<label>Sellers Description</label>

							<textarea th:field="*{description}" class="form-control" rows="4"
								maxlength="500"
								placeholder="Tell us something about your business..." required></textarea>

						</div>


						<!-- Buttons -->

						<div class="button-group">

							<button type="button" class="btn-submit" onclick="nextPage(1)">

								Next <i class="bi bi-arrow-right"></i>

							</button>

						</div>

					</div>


					<!-- ================================= -->
					<!-- PAGE 2 : ADDRESS DETAILS -->
					<!-- ================================= -->

					<div class="form-page" id="page2">

						<div class="page-title">📍 Address Details</div>


						<!-- State -->

						<div class="mb-3">

							<label>State</label> <input type="text" th:field="*{state}"
								class="form-control" maxlength="15" pattern="[A-Za-z ]{1,15}"
								oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
								required>

						</div>


						<!-- City -->

						<div class="mb-3">

							<label>City</label> <input type="text" th:field="*{city}"
								class="form-control" maxlength="15" pattern="[A-Za-z ]{1,15}"
								oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
								required>

						</div>


						<!-- Address -->

						<div class="mb-3">

							<label>Address</label>

							<textarea th:field="*{address}" class="form-control" rows="5"
								maxlength="250" required></textarea>

						</div>


						<!-- Buttons -->

						<div class="button-group">

							<button type="button" class="btn-back" onclick="previousPage(2)">

								<i class="bi bi-arrow-left"></i> Previous

							</button>


							<button type="button" class="btn-submit" onclick="nextPage(2)">

								Next <i class="bi bi-arrow-right"></i>

							</button>

						</div>

					</div>


					<!-- ================================= -->
					<!-- PAGE 3 : DOCUMENT DETAILS -->
					<!-- ================================= -->

					<div class="form-page" id="page3">

						<div class="page-title">📄 Documents & Registration</div>


						<!-- Profile Image -->

						<div class="mb-3">

							<label>Profile Image</label> <input type="file"
								th:field="*{imageFile}" class="form-control" accept="image/*"
								required>

						</div>


						<!-- Aadhar -->

						<div class="mb-3">

							<label>Aadharcard Number</label> <input type="text"
								th:field="*{aadharcard}" class="form-control" maxlength="12"
								pattern="[0-9]{12}"
								oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>

						</div>


						<!-- Buttons -->

						<div class="button-group">

							<button type="button" class="btn-back" onclick="previousPage(3)">

								<i class="bi bi-arrow-left"></i> Previous

							</button>


							<button type="submit" class="btn-submit">

								<i class="bi bi-check-circle"></i> Register Now

							</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>





</body>
</html>
