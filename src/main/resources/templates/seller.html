<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seller Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial;

    /* 🌄 Wallpaper Background */
    background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center center/cover;
    position: relative;
  }

  /* 🔳 Dark transparent overlay */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: rgba(0,0,0,0.45);
    z-index: 0;
  }

  .fullscreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* 💎 Glass Card */
  .card-box {
    width: 100%;
    max-width: 1100px;
    height: 90vh;
    display: flex;
    border-radius: 22px;
    overflow: hidden;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* LEFT */
  .left {
    flex: 1;
    padding: 30px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .left h2 {
    font-weight: bold;
  }

  .carousel img {
    height: 250px;
    object-fit: cover;
    border-radius: 14px;
  }

  /* RIGHT */
  .right {
    flex: 1.2;
    padding: 30px;
    overflow-y: auto;
    color: white;
  }

  label {
    font-weight: 600;
    margin-bottom: 6px;
  }

  .form-control {
    border-radius: 12px;
    padding: 10px;
    background: rgba(255,255,255,0.9);
    border: none;
  }

  .form-control:focus {
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
  }

  .slider-value {
    color: #00f2fe;
    font-weight: bold;
  }

  .btn-submit {
    background: linear-gradient(45deg, #4f46e5, #06b6d4);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 12px;
    transition: 0.3s;
  }

  .btn-submit:hover {
    transform: scale(1.03);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  @media(max-width:768px){
    .card-box {
      flex-direction: column;
      height: auto;
    }
  }
</style>
</head>

<body>

<div class="fullscreen">

  <div class="card-box">

    <!-- LEFT -->
    <div class="left">

      <div>
        <h2>🛍 Become a Seller</h2>
        <p>Start your online business journey</p>
      </div>

      <!-- Carousel -->
      <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

          <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" class="d-block w-100">
          </div>

          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4" class="d-block w-100">
          </div>

          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" class="d-block w-100">
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

      <h3>Seller Registration</h3>
     
     <form th:action="@{/seller}" th:object="${seller}" method="post" enctype="multipart/form-data">

    <div class="mb-3">
        <label>Name</label> 
        <input type="text" th:field="*{name}" class="form-control"
		maxlength="25" pattern="[A-Za-z ]{1,25}"
		oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
		required>
	</div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Mobile</label>
        <input type="tel" th:field="*{mobile}" class="form-control" maxlength="10"
           pattern="[0-9]{10}"
           oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
    </div>

    <div class="mb-3">
        <label>Profile Image</label>
        <input type="file" th:field="*{imageFile}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Aadharcard Number</label>
        <input type="text" th:field="*{aadharcard}" class="form-control" maxlength="12"
           pattern="[0-9]{12}"
           oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
    </div>

    <div class="mb-3">
        <label>State</label> 
        <input type="text" th:field="*{state}"
		class="form-control" maxlength="15" pattern="[A-Za-z ]{1,15}"
		oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
		required>
	</div>

    <div class="mb-3">
        <label>City</label>
        <input type="text" th:field="*{city}"
		class="form-control" maxlength="15" pattern="[A-Za-z ]{1,15}"
		oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
		required>
    </div>
    
 
    <div class="mb-3">
        <label>Address</label>
        <textarea th:field="*{address}" class="form-control"></textarea>
    </div>
    
    <div class="mb-3">
        <label>Sellers Description</label>
        <textarea name="description" class="form-control"></textarea>
    </div>
    

    <button type="submit" class="btn-submit w-100 mt-2">
        Register Now
    </button>

</form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
