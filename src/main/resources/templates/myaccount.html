<!DOCTYPE html>
<html  lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium My Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background:
                linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .55)),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1700&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        .account-box {
            width: 100%;
            max-width: 1200px;

            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;

            overflow: hidden;

            box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
        }

        .left {
            padding: 45px;
            background: rgba(255, 255, 255, .05);
            text-align: center;
            color: #fff;
        }

        .profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, .3);
            object-fit: cover;
        }

        .edit-btn {
            margin-top: 20px;
            border-radius: 30px;
        }

        .right {
            padding: 45px;
        }

        .heading {
            color: #fff;
            font-size: 35px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .option {
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .08);

            border-radius: 20px;
            padding: 22px;

            color: white;

            transition: .35s;
            cursor: pointer;

            margin-bottom: 25px;
        }

        .option:hover {
            transform: translateY(-8px) scale(1.02);
            background: linear-gradient(135deg, #ff9800, #ff5722);
        }

        .option i {
            font-size: 30px;
            margin-right: 18px;
        }

        .option h5 {
            margin-bottom: 3px;
        }

        .option small {
            color: #ddd;
        }

        .logout {
            margin-top: 20px;
            border-radius: 35px;
            font-weight: 600;
        }

        @media (max-width:991px) {

            .left {
                border-bottom: 1px solid rgba(255, 255, 255, .1);
            }

        }
    </style>

</head>

<body>

    <div class="account-box">

        <div class="row g-0">

            
			<div class="col-lg-4 left">
			
			    <img th:src="@{/profileImage/{id}(id=${user.uid})}" 
			         class="profile">
			
			    <h3 class="mt-4" th:text="${user.uname}"></h3>
			
			    <p th:text="${user.uemail}"></p>
			
			    <a th:href="@{/editprofile/{id}(id=${user.uid})}"
					   class="btn btn-warning edit-btn px-4">
					
					    <i class="bi bi-pencil-square"></i>
					    Edit Profile

				</a>
			</div>
            <div class="col-lg-8 right">

                <div class="heading">
                    <i class="bi bi-person-circle"></i>
                    My Account
                </div>

                <div class="row">

                    <div class="col-md-6">
                        <div class="option d-flex align-items-center">

                            <i class="bi bi-bag-check-fill"></i>

                            <a href="/servicehistory" style="text-decoration: none; color: inherit;">
								    <div>
								        <h5>My Service History</h5>
								        <small>Track your History</small>
								    </div>
							</a>

                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="option d-flex align-items-center">

                            <i class="bi bi-heart-fill text-danger"></i>

                            <div>
                                <h5>Shortlisted Vehicles</h5>
                                <small>Your Dream Garage</small>
                            </div>

                        </div>
                    </div>

   
                </div>
                <a href="/login" class="text-decoration-none d-block">
					      <button class="btn btn-danger btn-lg logout">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </button>  
			   </a>

            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
