<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Profile</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
@import
	url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap')
	;

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Poppins', sans-serif;
}

body {
	background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .55)),
		url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1700&q=80");
	background-size: cover;
	background-position: center;
	background-attachment: fixed;
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 40px;
}

.profile-box {
	width: 100%;
	max-width: 1100px;
	background: rgba(255, 255, 255, .08);
	backdrop-filter: blur(20px);
	border-radius: 25px;
	border: 1px solid rgba(255, 255, 255, .15);
	overflow: hidden;
	box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}

.left {
	background: rgba(255, 255, 255, .05);
	padding: 40px;
	text-align: center;
}

.seller-img {
	width: 220px;
	height: 220px;
	border-radius: 50%;
	object-fit: cover;
	border: 6px solid rgba(255, 255, 255, .3);
}

.right {
	padding: 45px;
	color: white;
}

.seller-name {
	font-size: 38px;
	font-weight: 700;
	margin-bottom: 25px;
}

.info-box {
	background: rgba(255, 255, 255, .12);
	padding: 25px;
	border-radius: 18px;
	margin-bottom: 20px;
	border: 1px solid rgba(255, 255, 255, .1);
}

.info-title {
	font-size: 20px;
	font-weight: 600;
	color: #ffc107;
	margin-bottom: 15px;
}

.info-box p {
	margin-bottom: 8px;
	color: #eee;
	line-height: 28px;
}

.contact i {
	color: #ffc107;
	margin-right: 10px;
}

.back-btn {
	margin-top: 20px;
	border-radius: 30px;
}

@media ( max-width :991px) {
	.left {
		border-bottom: 1px solid rgba(255, 255, 255, .15);
	}
}
</style>

</head>

<body>

	<div class="profile-box">

		<div class="row g-0">

			<!-- Left -->

			<div class="col-lg-4 left">

				<img th:src="@{/sellerImage/{id}(id=${seller.sid})}"
					class="seller-img">

				<h3 class="text-white mt-4" th:text="${seller.name}"></h3>

				<p class="text-light" th:text="${seller.city+', '+seller.state}"></p>

			</div>

			<!-- Right -->

			<div class="col-lg-8 right">

				<div class="seller-name">
					<i class="bi bi-person-badge-fill"></i> <span
						th:text="${seller.name}"></span>
				</div>

				<div class="info-box">

					<div class="info-title">
						<i class="bi bi-card-text"></i> Description
					</div>

					<p th:text="${seller.description}"></p>

				</div>

				<div class="info-box contact">

					<div class="info-title">
						<i class="bi bi-info-circle-fill"></i> Contact Information
					</div>

					<p>
						<i class="bi bi-envelope-fill"></i> <span
							th:text="${seller.email}"></span>
					</p>

					<p>
						<i class="bi bi-telephone-fill"></i> <span
							th:text="${seller.mobile}"></span>
					</p>

					<p>
						<i class="bi bi-geo-alt-fill"></i> <span
							th:text="${seller.address+', '+seller.city+', '+seller.state}">
						</span>
					</p>

				</div>

				<a href="/enlistedsellers" class="btn btn-warning back-btn px-4"> <i
					class="bi bi-arrow-left-circle"></i> Back
				</a>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
