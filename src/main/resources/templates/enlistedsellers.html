<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enlisted Sellers</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
	rel="stylesheet">


<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', sans-serif;
}

body {
	min-height: 100vh;
	background: linear-gradient(rgba(0, 0, 0, .72), rgba(0, 0, 0, .82)),
		url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=80');
	background-size: cover;
	background-position: center;
	background-attachment: fixed;
	padding-bottom: 40px;
}

/* =========================
       PAGE TITLE
       ========================= */
.page-title {
	text-align: center;
	color: #fff;
	font-size: 40px;
	font-weight: 700;
	margin: 40px 0;
	text-shadow: 0 5px 15px black;
}

/* =========================
       SEARCH
       ========================= */
.search-container {
	margin-bottom: 35px;
}

/* =========================
       GARAGE CARD
       ========================= */
.garage-card {
	background: rgba(255, 255, 255, .13);
	backdrop-filter: blur(15px);
	border: 1px solid rgba(255, 255, 255, .2);
	border-radius: 20px;
	overflow: hidden;
	transition: .35s;
	box-shadow: 0 15px 35px rgba(0, 0, 0, .45);
	height: 100%;
}

.garage-card:hover {
	transform: translateY(-8px);
	background: rgba(255, 255, 255, .18);
	box-shadow: 0 20px 45px rgba(0, 0, 0, .65);
}

.card-body {
	padding: 25px;
}

.garage-name {
	text-align: center;
	color: #ff9800;
	font-size: 25px;
	font-weight: 700;
	margin-bottom: 20px;
}

.garage-info {
	color: white;
	font-size: 15px;
	margin-bottom: 12px;
}

.garage-info i {
	color: #38bdf8;
	margin-right: 10px;
	font-size: 17px;
}

/* =========================
       VIEW DETAILS BUTTON
       ========================= */
.view-btn {
	display: block;
	margin-top: 25px;
	text-align: center;
	text-decoration: none;
	background: #ff9800;
	color: white;
	padding: 12px;
	border-radius: 12px;
	font-weight: 700;
	transition: .3s;
}

.view-btn:hover {
	background: #ff7700;
	color: white;
	transform: scale(1.03);
}

/* =========================
       DELETE BUTTON
       ========================= */
.btn-details {
	display: block;
	width: 100%;
	margin-top: 18px;
	padding: 11px;
	text-align: center;
	background: #f97316;
	color: white;
	border-radius: 12px;
	text-decoration: none;
	font-weight: 700;
	font-size: 15px;
	transition: 0.3s ease;
}

.btn-details i {
	margin-right: 8px;
	font-size: 16px;
}

.btn-details:hover {
	background: #ea580c;
	color: white;
	transform: translateY(-2px);
}

/* =========================
       PAGINATION
       ========================= */
.pagination-container {
	margin-top: 45px;
	display: flex;
	justify-content: center;
}

.pagination {
	margin-bottom: 10px;
}

.pagination .page-link {
	color: #ff9800;
	background: rgba(255, 255, 255, 0.95);
	border: 1px solid #ff9800;
	font-weight: 600;
	padding: 10px 16px;
	transition: 0.3s;
}

.pagination .page-link:hover {
	background: #ff9800;
	color: white;
	border-color: #ff9800;
}

.pagination .active .page-link {
	background: #ff9800;
	border-color: #ff9800;
	color: white;
}

.pagination .disabled .page-link {
	pointer-events: none;
	opacity: 0.5;
}

/* =========================
       PAGE INFORMATION
       ========================= */
.page-info {
	text-align: center;
	color: white;
	font-size: 16px;
	margin-top: 10px;
	margin-bottom: 20px;
}

.page-info strong {
	color: #ff9800;
}

/* =========================
       NO DATA
       ========================= */
.no-data {
	text-align: center;
	color: white;
	font-size: 20px;
	margin-top: 50px;
	background: rgba(255, 255, 255, 0.10);
	padding: 30px;
	border-radius: 15px;
}

/* =========================
       MOBILE
       ========================= */
@media ( max-width : 576px) {
	.page-title {
		font-size: 30px;
		margin: 30px 0;
	}
	.pagination .page-link {
		padding: 8px 11px;
		font-size: 14px;
	}
}
</style>
```

</head>

<body>

	<div class="container">

		```
		<!-- =========================
     PAGE TITLE
     ========================= -->

		<h2 class="page-title">🚗 Our Enlisted Sellers</h2>


		<!-- =========================
     SEARCH
     ========================= -->

		<div class="row justify-content-center search-container">

			<div class="col-md-6">

				<form th:action="@{/searchSeller}" method="get">

					<div class="input-group input-group-lg">

						<span class="input-group-text bg-white border-0"> <i
							class="bi bi-search"></i>

						</span> <input type="text" name="keyword" class="form-control border-0"
							placeholder="Search by City,State" th:value="${keyword}">


						<button class="btn btn-warning fw-bold" type="submit">

							Search</button>

					</div>

				</form>

			</div>

		</div>



		<!-- =========================
     SELLER CARDS
     ========================= -->

		<div class="row g-4" th:if="${sellers != null and !sellers.isEmpty()}">


			<div class="col-lg-4 col-md-6 col-sm-12"
				th:each="seller : ${sellers}">


				<div class="garage-card">


					<div class="card-body">


						<!-- SELLER NAME -->

						<h4 class="garage-name" th:text="${seller.name}">Seller Name

						</h4>



						<!-- VIEW DETAILS -->

						<a th:href="@{/sellerdetails/{id}(id=${seller.sid})}"
							class="view-btn"> <i class="bi bi-eye-fill"></i> View Details

						</a>



						<!-- DELETE -->

						<a th:href="@{/deleteseller(sid=${seller.sid})}"
							class="btn-details"> <i class="bi bi-trash-fill"></i> Delete

						</a>


					</div>

				</div>


			</div>

		</div>



		<!-- =========================
     NO SELLER DATA
     ========================= -->

		<div class="no-data" th:if="${sellers == null or sellers.isEmpty()}">

			<i class="bi bi-exclamation-circle"></i> No sellers found.

		</div>



		<!-- =========================
     PAGINATION
     ========================= -->

		<div class="pagination-container"
			th:if="${totalPages != null and totalPages > 0}">


			<nav aria-label="Sellers Pagination">


				<ul class="pagination">


					<!-- =========================
                 PREVIOUS BUTTON
                 ========================= -->

					<li class="page-item"
						th:classappend="${currentPage == 0} ? 'disabled'"><a
						class="page-link"
						th:href="@{/enlistedsellers(
                       pageNo=${currentPage - 1},
                       pageSize=${pageSize},
                       keyword=${keyword}
                   )}">

							<i class="bi bi-chevron-left"></i> Previous

					</a></li>



					<!-- =========================
                 PAGE NUMBERS
                 ========================= -->

					<li class="page-item"
						th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
						th:classappend="${currentPage == i} ? 'active'"><a
						class="page-link"
						th:href="@{/enlistedsellers(
                       pageNo=${i},
                       pageSize=${pageSize},
                       keyword=${keyword}
                   )}"
						th:text="${i + 1}"> 1 </a></li>



					<!-- =========================
                 NEXT BUTTON
                 ========================= -->

					<li class="page-item"
						th:classappend="${currentPage == totalPages - 1} ? 'disabled'">


						<a class="page-link"
						th:href="@{/enlistedsellers(
                       pageNo=${currentPage + 1},
                       pageSize=${pageSize},
                       keyword=${keyword}
                   )}">

							Next <i class="bi bi-chevron-right"></i>
					</a>
					</li>
				</ul>
			</nav>
		</div>
		<!-- =========================
     PAGE INFORMATION
     ========================= -->

		<div class="page-info"
			th:if="${totalPages != null and totalPages > 0}">

			Page <strong th:text="${currentPage + 1}"> 1 </strong> of <strong
				th:text="${totalPages}"> 1 </strong>

		</div>
	</div>

	<!-- =========================
     BOOTSTRAP JS
     ========================= -->

	<!-- Bootstrap JS -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>
</body>
</html>
