<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Enlisted Cars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            background:
            linear-gradient(
                rgba(0,0,0,0.72),
                rgba(0,0,0,0.82)
            ),
            url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=80');


            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            font-family: 'Segoe UI', sans-serif;

            color: white;

        }


        /* Page Heading */

        .page-title {

            text-align: center;

            margin: 35px 0;

            font-size: 38px;

            font-weight: 800;

            color: white;

            text-shadow: 0 5px 15px black;

        }



        /* Masonry Layout */

        .masonry {

            column-count: 3;

            column-gap: 20px;

            max-width: 1200px;

            margin: auto;

        }



        /* Car Card */

        .car-tile {

            display: inline-block;

            width: 100%;

            margin-bottom: 20px;

            break-inside: avoid;


            background: rgba(255,255,255,0.14);

            backdrop-filter: blur(12px);


            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 20px;


            overflow: hidden;


            box-shadow:
            0 15px 35px rgba(0,0,0,0.6);


            transition: 0.4s;

        }



        .car-tile:hover {

            transform: translateY(-10px);


            background: rgba(255,255,255,0.20);


            box-shadow:
            0 20px 45px rgba(0,0,0,0.8);

        }




        /* Card Body */

        .car-body {

            padding: 20px;

        }



        .car-title {

            font-size: 21px;

            font-weight: 800;

            color: white;

        }



        .price {

            color: #22c55e;

            font-size: 20px;

            font-weight: 800;

            margin: 10px 0;

        }



        .info {

            color: #e5e7eb;

            font-size: 14px;

            margin: 8px 0;

        }



        .info i {

            color: #38bdf8;

            margin-right: 8px;

            font-size: 16px;

        }



        /* Model Badge */

        .badge-custom {

            display: inline-block;

            background: #f97316;

            color: white;


            padding: 6px 14px;

            border-radius: 20px;


            font-size: 12px;

            font-weight: 700;


            margin-top: 10px;

        }



        /* View Button */

        .btn-details {

            display: block;

            margin-top: 18px;

            padding: 11px;


            text-align: center;


            background: #f97316;

            color: white;


            border-radius: 12px;


            text-decoration: none;


            font-weight: 700;


            transition: 0.3s;

        }



        .btn-details:hover {

            background: #ea580c;

            color: white;

        }



        /* Responsive */

        @media(max-width:992px) {

            .masonry {

                column-count: 2;

            }

        }



        @media(max-width:576px) {

            .masonry {

                column-count: 1;

            }

        }


    </style>


</head>


<body>


<div class="container">


    <h2 class="page-title">
        🚘 Enlisted Cars
    </h2>
    
    <!-- Search Bar -->
<div class="row justify-content-center mb-4">
    <div class="col-md-6">
        <form th:action="@{/search}" method="get">
            <div class="input-group input-group-lg">

                <span class="input-group-text bg-white border-0">
                    <i class="bi bi-search"></i>
                </span>

                <input type="text"
                       name="keyword"
                       class="form-control border-0"
                       placeholder="Search by Company, Car Name, City..."
                       th:value="${keyword}">

                <button class="btn btn-warning fw-bold" type="submit">
                    Search
                </button>

            </div>
        </form>
    </div>
</div>



    <div class="masonry">



        <div class="car-tile" th:each="car : ${cars}">


            <div class="car-body">


                <div class="car-title"
                     th:text="${car.companyName + ' ' + car.carName}">
                    Car Name
                </div>



                <div class="price">

                    ₹

                    <span th:text="${car.purchasePrice}">
                        Price
                    </span>

                </div>




                <div class="info">

                    <i class="bi bi-calendar3"></i>

                    Year :

                    <span th:text="${car.year}">
                        2025
                    </span>

                </div>




                <div class="info">

                    <i class="bi bi-fuel-pump"></i>

                    Fuel :

                    <span th:text="${car.fuelType}">
                        Petrol
                    </span>

                </div>




                <div class="info">

                    <i class="bi bi-geo-alt-fill"></i>

                    City :

                    <span th:text="${car.city}">
                        Mumbai
                    </span>

                </div>
                <div class="badge-custom"
                     th:text="${car.model}">
                    Model
                </div>
                
                <a th:href="@{/details/{id}(id=${car.carid})}"
				   class="btn-details">
				    <i class="bi bi-eye-fill"></i>
				    View Details
				</a>
                
                <a th:href="@{/deletecars(carid=${car.carid})}"
					   class="btn-details">
					   <i class="bi bi-eye-fill"></i>
					    Delete
				</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
