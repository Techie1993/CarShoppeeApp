<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit User Details</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
		url('/images/car1.jpg');
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
	background-attachment: fixed;
	font-family: 'Segoe UI', sans-serif;
}

.main-container {
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 30px;
}

.card {
	width: 100%;
	max-width: 520px;
	border: none;
	border-radius: 20px;
	background: rgba(255, 255, 255, .18);
	backdrop-filter: blur(15px);
	box-shadow: 0 15px 35px rgba(0, 0, 0, .4);
}

.card-body {
	padding: 35px;
}

.title {
	color: #fff;
	text-align: center;
	margin-bottom: 25px;
	font-weight: bold;
}

.title i {
	font-size: 45px;
	color: #ffc107;
}

label {
	color: white;
	font-weight: 600;
}

.form-control {
	border-radius: 30px;
	height: 45px;
}

.input-group-text {
	border-radius: 0 30px 30px 0;
	cursor: pointer;
	background: white;
}

.btn-update {
	width: 100%;
	border-radius: 30px;
	height: 45px;
	font-weight: bold;
	font-size: 17px;
}

.alert-msg {
	text-align: center;
	font-weight: bold;
	margin-bottom: 15px;
}
</style>

</head>

<body>

	<div class="main-container justify-content-end pr-5">

		<div class="card">

			<div class="card-body">

				<h2 class="title">
					<i class="bi bi-pencil-square"></i><br> Edit User Details
				</h2>

				<div th:if="${success}">
					<h5 class="alert-msg text-success" th:text="${success}"></h5>
				</div>

				<div th:if="${error}">
					<h5 class="alert-msg text-danger" th:text="${error}"></h5>
				</div>

				<form th:action="@{/editprofile/{id}(id=${editing.eid})}" th:object="${editing}"
					method="post" enctype="multipart/form-data">

					<input type="hidden" th:field="*{eid}">

					<div class="form-group">
						<label> Updated Full Name</label> <input type="text" class="form-control"
							placeholder="Enter Full Name" th:field="*{newname}" required>
					</div>

					<div class="form-group">
						<label>Updated Email Address</label> <input type="email"
							class="form-control" placeholder="Enter Email"
							th:field="*{newemail}" required>
					</div>

					<div class="form-group">
						<label>Updated Mobile Number</label> <input type="text" maxlength="10"
							class="form-control" placeholder="Enter Mobile Number"
							th:field="*{newmob}" required>
					</div>

					<div class="form-group">
						<label>Updated State</label> <input type="text" class="form-control"
							placeholder="Enter State" th:field="*{newstate}" required>
					</div>

					<div class="form-group">
						<label>Updated City</label> <input type="text" class="form-control"
							placeholder="Enter City" th:field="*{newcity}" required>
					</div>

					<div class="form-group">
						<label>Updated Password</label>

						<div class="input-group">

							<input type="password" id="password" class="form-control"
								placeholder="Enter Password" th:field="*{newpass}" required>

							<div class="input-group-append">
								<span class="input-group-text" onclick="togglePassword()">
									<i class="bi bi-eye" id="eyeIcon"></i>
								</span>
							</div>

						</div>
					</div>

					<div class="form-group">
						<label>Updated Profile Image</label> <input type="file"
							name="profileImage" class="form-control">
					</div>

					<button class="btn btn-warning btn-update mt-3" type="submit">
						<i class="bi bi-pencil-square"></i> Update Details
					</button>

				</form>

			</div>

		</div>

	</div>

	<script>

function togglePassword(){

    const password=document.getElementById("password");
    const eye=document.getElementById("eyeIcon");

    if(password.type==="password"){
        password.type="text";
        eye.classList.remove("bi-eye");
        eye.classList.add("bi-eye-slash");
    }
    else{
        password.type="password";
        eye.classList.remove("bi-eye-slash");
        eye.classList.add("bi-eye");
    }

}

</script>

</body>
</html>
