<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Credit Card</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
	min-height: 100vh;
	background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: 'Segoe UI', sans-serif;
}

.main-box {
	width: 900px;
	background: rgba(255, 255, 255, 0.12);
	backdrop-filter: blur(15px);
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.card-preview {
	height: 230px;
	border-radius: 20px;
	padding: 25px;
	color: white;
	background: linear-gradient(135deg, #667eea, #764ba2);
	box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
	position: relative;
}

.chip {
	width: 50px;
	height: 35px;
	background: gold;
	border-radius: 8px;
	margin-bottom: 25px;
}

.card-number {
	font-size: 22px;
	letter-spacing: 3px;
	margin-bottom: 25px;
}

.card-bottom {
	display: flex;
	justify-content: space-between;
	font-size: 14px;
}

.form-box {
	background: white;
	border-radius: 20px;
	padding: 30px;
}

.form-control {
	border-radius: 10px;
	height: 40px;
}

.btn-custom {
	width: 100%;
	border-radius: 20px;
	background: linear-gradient(135deg, #667eea, #764ba2);
	border: none;
	color: white;
	padding: 10px;
	font-weight: 600;
}

.btn-custom:hover {
	opacity: 0.9;
}

h2 {
	font-weight: 700;
}
</style>

</head>

<body>

	<div class="main-box">

		<div class="row align-items-center">

			<!-- LEFT CREDIT CARD DESIGN -->
			<div class="col-md-6 mb-4 mb-md-0">

				<h2 class="text-white mb-4">Premium Payment</h2>

				<div class="card-preview">

					<div class="chip"></div>

					<div class="card-number">**** **** **** 4567</div>

					<div class="card-bottom">
						<div>
							<small>Card Holder</small> <br> JOHN DOE
						</div>

						<div>
							<small>Expiry</small> <br> 12/28
						</div>
					</div>

				</div>

			</div>


			<!-- RIGHT FORM -->
			<div class="col-md-6">

				<div class="form-box">

					<h3 class="text-center mb-4">Debit Card Details</h3>


					<form method="post">

						<div class="form-group">
							<label>Card Holder's Name</label> <input type="text"
								class="form-control" placeholder="Enter Holder Name">
						</div>


					<div class="form-group">
                        <label>Debit Card Number</label>

                        <div class="input-group">
                            <input type="text"
                                   class="form-control"
                                   id="debit"
                                   placeholder="Enter Debit Card Number"
                                   maxlength="12"
                                    required>

                            <div class="input-group-append">
                                <span class="input-group-text" onclick="toggleDebit()">
                                    <i class="bi bi-eye" id="eyeIconn"></i>
                                </span>
                            </div>
                        </div>
                    </div>

						<div class="row">

							<div class="col-md-6">
								<label>CVV</label> 
								<input type="password" class="form-control"
									placeholder="CVV">
							</div>


							<div class="col-md-6">
								<label>ExpiryYear</label> <input type="text"
									class="form-control" placeholder="MM/YY">
							</div>
						</div>
						<button type="submit" class="btn btn-custom mt-4">Pay Now
						</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
<script>
        function toggleDebit() {
            const debit = document.getElementById("debit");
            const eye = document.getElementById("eyeIconn");

            if (debit.type === "password") {
                debit.type = "text";
                eye.classList.remove("bi-eye");
                eye.classList.add("bi-eye-slash");
            } else {
                debit.type = "password";
                eye.classList.remove("bi-eye-slash");
                eye.classList.add("bi-eye");
            }
        }
    </script>

</html>
