<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Payment</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>
body {
	min-height: 100vh;
	background: linear-gradient(135deg, #141e30, #243b55);
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: 'Segoe UI', sans-serif;
}

.payment-container {
	width: 950px;
	background: rgba(255, 255, 255, 0.12);
	backdrop-filter: blur(15px);
	border-radius: 25px;
	padding: 40px;
	box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.title {
	color: white;
	font-weight: 700;
	text-align: center;
	margin-bottom: 35px;
}

.qr-box {
	background: white;
	padding: 25px;
	border-radius: 20px;
	text-align: center;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.qr-box img {
	width: 220px;
	height: 220px;
}

.scan-text {
	margin-top: 15px;
	font-weight: 600;
	color: #333;
}

.form-card {
	background: white;
	padding: 30px;
	border-radius: 20px;
}

.form-control {
	border-radius: 12px;
	height: 45px;
}

.input-group-text {
	background: #667eea;
	color: white;
	border: none;
}

.pay-btn {
	width: 100%;
	padding: 12px;
	border: none;
	border-radius: 25px;
	background: linear-gradient(135deg, #667eea, #764ba2);
	color: white;
	font-size: 17px;
	font-weight: 600;
}

.pay-btn:hover {
	opacity: 0.9;
}

.secure {
	color: #28a745;
	text-align: center;
	margin-top: 15px;
	font-size: 14px;
}
</style>

</head>


<body>
	<div class="payment-container">
		<h2 class="title">
			<i class="bi bi-qr-code-scan"></i> Secure QR Payment
		</h2>
		<div class="row align-items-center">
			<!-- QR SECTION -->
			<div class="col-md-6">
				<div class="qr-box">
					<img
						src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=test@upi"
						alt="Payment QR">
					<h5 class="scan-text">Scan QR Code To Pay</h5>
					<p class="text-muted">Use Google Pay / PhonePe / Paytm</p>
				</div>
			</div>

			<!-- FORM SECTION -->

			<div class="col-md-6">
				<div class="form-card">
					<h3 class="text-center mb-4">Payment Details</h3>
					<form method="post">
						<div class="form-group">

							<label>Customer Name</label> <input type="text"
								class="form-control" placeholder="Enter Your Name" required>

						</div>
						
						<div class="form-group">
							<label>Mobile Number</label> <input type="text"
								class="form-control" placeholder="Enter Mobile Number"
								maxlength="10" required>
						</div>

						<div class="form-group">
							<label>Amount</label>
							<div class="input-group">

								<div class="input-group-prepend">

									<span class="input-group-text"> ₹ </span>
								</div>
								<input type="text" class="form-control"
									placeholder="Enter Amount" required>
							</div>
						</div>

						<div class="form-group">
                        <label>TransactionId</label>

                        <div class="input-group">
                            <input type="text"
                                   class="form-control"
                                   id="transid"
                                   placeholder="Enter Transaction ID"
                                   maxlength="11"
                                    required>

                            <div class="input-group-append">
                                <span class="input-group-text" onclick="toggleTrans()">
                                    <i class="bi bi-eye" id="eyeIconn"></i>
                                </span>
                            </div>
                        </div>
                    </div>
						<p class="secure">
							<i class="bi bi-shield-check"></i> 100% Secure Payment
						</p>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>

<script>
        function toggleTrans() {
            const transid = document.getElementById("transid");
            const eye = document.getElementById("eyeIconn");

            if (transid.type === "password") {
                transid.type = "text";
                eye.classList.remove("bi-eye");
                eye.classList.add("bi-eye-slash");
            } else {
                transid.type = "password";
                eye.classList.remove("bi-eye-slash");
                eye.classList.add("bi-eye");
            }
        }
</script>
</html>
