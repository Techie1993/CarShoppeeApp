<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Luxury Car Details</title>


<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
	rel="stylesheet">


<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: #020617;
	font-family: 'Segoe UI', sans-serif;
	color: white;
}

/* MAIN */
.page {
	width: 100%;
}

/* =====================
1. CAROUSEL SECTION
===================== */
.carousel-section {
	height: 70vh;
	padding: 30px 60px;
}

.carousel {
	height: 100%;
	border-radius: 35px;
	overflow: hidden;
	box-shadow: 0 30px 80px black;
}

.carousel-inner, .carousel-item {
	height: 100%;
}

.carousel img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

/* =====================
2. CAR DATA SECTION
===================== */
.car-data {
	padding: 45px 80px;
	background: linear-gradient(135deg, #111827, #020617);
	text-align: center;
}

.company {
	font-size: 25px;
	color: #38bdf8;
	font-weight: 700;
}

.car-name {
	font-size: 55px;
	font-weight: 900;
	color: #fbbf24;
}

.price {
	font-size: 35px;
	color: #22c55e;
	font-weight: bold;
	margin: 15px;
}

.info-container {
	display: flex;
	justify-content: center;
	gap: 25px;
	flex-wrap: wrap;
	margin-top: 35px;
}

.info-card {
	width: 200px;
	padding: 25px;
	background: rgba(255, 255, 255, 0.1);
	border-radius: 25px;
	box-shadow: 0 15px 30px black;
}

.info-card i {
	font-size: 35px;
	color: #38bdf8;
}

.label {
	color: #94a3b8;
	margin-top: 10px;
}

.value {
	font-size: 22px;
	font-weight: bold;
}

/* =====================
3. DESCRIPTION SECTION
===================== */
.description-section {
	padding: 50px 100px;
	background: #020617;
}

.description-box {
	background: rgba(255, 255, 255, 0.08);
	border-radius: 35px;
	padding: 45px;
	border: 1px solid rgba(255, 255, 255, 0.2);
	backdrop-filter: blur(20px);
	box-shadow: 0 25px 60px black;
}

.description-box h2 {
	color: #f97316;
	font-size: 35px;
}

.description-box p {
	font-size: 20px;
	line-height: 1.9;
	color: #e5e7eb;
}

@media ( max-width :768px) {
	.carousel-section {
		height: 40vh;
		padding: 20px;
	}
	.car-data {
		padding: 30px 20px;
	}
	.description-section {
		padding: 30px 20px;
	}
	.car-name {
		font-size: 35px;
	}
}
</style>

</head>

<body>
	<div class="page">
		<!-- ==========================
     PART 1 : CAROUSEL
========================== -->
		<section class="carousel-section">
			<div id="carCarousel" class="carousel slide" data-bs-ride="carousel"
				data-bs-interval="2500">
				<div class="carousel-inner">

					<div th:each="img, status : ${car.images}"
				         class="carousel-item"
				         th:classappend="${status.index == 0} ? 'active'">
				
				
				        <img th:src="@{/car/image/{id}(id=${img.imageId})}"
				             class="d-block w-100"
				             alt="Car Image">
    				</div>


					<div class="carousel-item">

						<img
							src="https://images.unsplash.com/photo-1542362567-b07e54358753">

					</div>
				</div>

				<button class="carousel-control-prev" data-bs-target="#carCarousel"
					data-bs-slide="prev">

					<span class="carousel-control-prev-icon"></span>

				</button>

				<button class="carousel-control-next" data-bs-target="#carCarousel"
					data-bs-slide="next">

					<span class="carousel-control-next-icon"></span>
				</button>
			</div>
		</section>

		<!-- ==========================
     PART 2 : CAR DATA
========================== -->

		<section class="car-data">
			<div class="company" th:text="${car.companyName}">BMW</div>
			<div class="car-name" th:text="${car.carName}">BMW X5</div>
			<div class="price">
				₹ <span th:text="${car.purchasePrice}"> 5000000 </span>
			</div>

			<div class="info-container">
				<div class="info-card">
					<i class="bi bi-calendar"></i>
					<div class="label">YEAR</div>
					<div class="value" th:text="${car.year}">2025</div>
				</div>
				
				<div class="info-card">
					<i class="bi bi-fuel-pump"></i>
					<div class="label">FUEL</div>
					<div class="value" th:text="${car.fuelType}">Petrol</div>
				</div>
				
				<div class="info-card">
					<i class="bi bi-geo-alt"></i>
					<div class="label">CITY</div>
					<div class="value" th:text="${car.city}">Mumbai</div>
				</div>
				
				<div class="info-card">
					<i class="bi bi-car-front"></i>
					<div class="label">MODEL</div>
					<div class="value" th:text="${car.model}">SUV</div>
				</div>
			</div>
		</section>

		<!--==========================
     PART 3 : DESCRIPTION
========================== -->


		<section class="description-section">
			<div class="description-box">
				<h2>About This Car</h2>
				<p th:text="${car.description}">Premium luxury vehicle with
					advanced technology and powerful performance.</p>
			</div>
		</section>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
