<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enlisted Garages</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Segoe UI', sans-serif;
}

body {
	min-height: 100vh;
	background: linear-gradient(rgba(0, 0, 0, .72), rgba(0, 0, 0, .82)),
		url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=80');
	background-size: cover;
	background-position: center;
	background-attachment: fixed;
}

.page-title {
	text-align: center;
	color: #fff;
	font-size: 40px;
	font-weight: 700;
	margin: 40px 0;
	text-shadow: 0 5px 15px black;
}

.garage-card {
	background: rgba(255, 255, 255, .13);
	backdrop-filter: blur(15px);
	border: 1px solid rgba(255, 255, 255, .2);
	border-radius: 20px;
	overflow: hidden;
	transition: .35s;
	box-shadow: 0 15px 35px rgba(0, 0, 0, .45);
	height: 100%;
}

.garage-card:hover {
	transform: translateY(-8px);
	background: rgba(255, 255, 255, .18);
	box-shadow: 0 20px 45px rgba(0, 0, 0, .65);
}

.card-body {
	padding: 25px;
}

.garage-name {
	text-align: center;
	color: #ff9800;
	font-size: 25px;
	font-weight: 700;
	margin-bottom: 20px;
}

.garage-info {
	color: white;
	font-size: 15px;
	margin-bottom: 12px;
}

.garage-info i {
	color: #38bdf8;
	margin-right: 10px;
	font-size: 17px;
}

.view-btn {
	display: block;
	margin-top: 25px;
	text-align: center;
	text-decoration: none;
	background: #ff9800;
	color: white;
	padding: 12px;
	border-radius: 12px;
	font-weight: 700;
	transition: .3s;
}

.view-btn:hover {
	background: #ff7700;
	color: white;
	transform: scale(1.03);
}

.btn-details {
	display: block;
	width: 100%;
	margin-top: 18px;
	padding: 11px;
	text-align: center;
	background: #f97316;
	color: white;
	border-radius: 12px;
	text-decoration: none;
	font-weight: 700;
	font-size: 15px;
	transition: 0.3s ease;
}

.btn-details i {
	margin-right: 8px;
	font-size: 16px;
}

.btn-details:hover {
	background: #ea580c;
	color: white;
	transform: translateY(-2px);
}

/* =========================
           PAGINATION
           ========================= */
.pagination-container {
	margin-top: 45px;
	margin-bottom: 20px;
	display: flex;
	justify-content: center;
}

.pagination {
	gap: 6px;
}

.pagination .page-item .page-link {
	background: rgba(255, 255, 255, 0.12);
	border: 1px solid rgba(255, 255, 255, 0.25);
	color: white;
	border-radius: 10px;
	padding: 10px 16px;
	font-weight: 600;
	backdrop-filter: blur(10px);
	transition: 0.3s;
}

.pagination .page-item .page-link:hover {
	background: #ff9800;
	color: white;
	border-color: #ff9800;
	transform: translateY(-2px);
}

.pagination .page-item.active .page-link {
	background: #ff9800;
	border-color: #ff9800;
	color: white;
}

.pagination .page-item.disabled .page-link {
	background: rgba(255, 255, 255, 0.05);
	color: rgba(255, 255, 255, 0.4);
	border-color: rgba(255, 255, 255, 0.1);
	cursor: not-allowed;
	transform: none;
}

.page-info {
	text-align: center;
	color: white;
	font-size: 15px;
	margin-bottom: 40px;
}

.page-info strong {
	color: #ff9800;
}
</style>

</head>


<body>

	<div class="container">

		<!-- PAGE TITLE -->

		<h2 class="page-title">🚗 Our Enlisted Garages</h2>


		<!-- SEARCH -->

		<div class="row justify-content-center mb-4">

			<div class="col-md-6">

				<form th:action="@{/searchGarage}" method="get">

					<div class="input-group input-group-lg">

						<span class="input-group-text bg-white border-0"> <i
							class="bi bi-search"></i>
						</span> <input type="text" name="keyword" class="form-control border-0"
							placeholder="Search by City,Type" th:value="${keyword}">

						<button class="btn btn-warning fw-bold" type="submit">
							Search</button>

					</div>

				</form>

			</div>

		</div>


		<!-- GARAGE CARDS -->

		<div class="row g-4">

			<div class="col-lg-4 col-md-6 col-sm-12"
				th:each="garage : ${garages}">

				<div class="garage-card">

					<div class="card-body">

						<!-- Garage Name -->

						<h4 class="garage-name" th:text="${garage.garageName}">

							Garage Name</h4>


						<!-- Owner -->

						<div class="garage-info">

							<i class="bi bi-person-fill"></i> <strong>Owner :</strong> <span
								th:text="${garage.owner}"> Owner Name </span>

						</div>


						<!-- City -->

						<div class="garage-info">

							<i class="bi bi-geo-alt-fill"></i> <strong>City :</strong> <span
								th:text="${garage.city}"> City </span>

						</div>


						<!-- Garage Type -->

						<div class="garage-info">

							<i class="bi bi-tools"></i> <strong>Garage Type :</strong> <span
								th:text="${garage.garageType}"> Car Garage </span>

						</div>


						<!-- View Details -->

						<a th:href="@{/garagedetails/{id}(id=${garage.gid})}"
							class="view-btn"> <i class="bi bi-eye-fill"></i> View Details

						</a>


						<!-- Delete -->

						<a th:href="@{/deletegarage(gid=${garage.gid})}"
							class="btn-details"> <i class="bi bi-trash-fill"></i> Delete

						</a>

					</div>

				</div>

			</div>

		</div>


		<!-- =========================
         PAGINATION
         ======================== -->

		<div class="pagination-container" th:if="${totalPages > 0}">

			<nav aria-label="Garage Pagination">

				<ul class="pagination">


					<!-- PREVIOUS BUTTON -->

					<li class="page-item"
						th:classappend="${currentPage == 0} ? 'disabled'"><a
						class="page-link"
						th:href="@{/pgarage(pageNo=${currentPage - 1},pageSize=${pageSize})}">

							<i class="bi bi-chevron-left"></i> Previous

					</a></li>


					<!-- PAGE NUMBERS -->

					<li class="page-item"
						th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
						th:classappend="${currentPage == i} ? 'active'"><a
						class="page-link"
						th:href="@{/pgarage(pageNo=${i},pageSize=${pageSize})}"
						th:text="${i + 1}"> 1 </a></li>


					<!-- NEXT BUTTON -->

					<li class="page-item"
						th:classappend="${currentPage == totalPages - 1} ? 'disabled'">

						<a class="page-link"
						th:href="@{/pgarage(pageNo=${currentPage + 1},pageSize=${pageSize})}">

							Next <i class="bi bi-chevron-right"></i>

					</a>

					</li>

				</ul>

			</nav>

		</div>


		<!-- PAGE INFORMATION -->

		<div class="page-info" th:if="${totalPages > 0}">

			Page <strong th:text="${currentPage + 1}"> 1 </strong> of <strong
				th:text="${totalPages}"> 1 </strong>

		</div>
	</div>


	<!-- Bootstrap JS -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
